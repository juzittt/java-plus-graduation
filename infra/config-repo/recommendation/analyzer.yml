server:
  port: 0
  shutdown: graceful

grpc:
  server:
    port: 0

spring:
  application:
    name: analyzer
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://localhost:6508/ewm_recommendations
    username: dbuser
    password: 12345
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
      show-sql: false
    open-in-view: false
  sql:
    init:
      mode: always

    topics:
      user-actions: stats.user-actions.v1
      events-similarity: stats.events-similarity.v1

management:
  endpoints:
    web:
      exposure:
        include: health,info