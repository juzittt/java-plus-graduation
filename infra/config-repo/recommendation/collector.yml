server:
  port: 0
  shutdown: graceful

grpc:
  server:
    port: 0

spring:
  application:
    name: collector
  lifecycle:
    timeout-per-shutdown-phase: 30s
    kafka:
      bootstrap-servers: localhost:9092

kafka:
  topics:
    user-actions: stats.user-actions.v1
    events-similarity: stats.events-similarity.v1

management:
  endpoints:
    web:
      exposure:
        include: health,info