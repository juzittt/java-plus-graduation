server:
  port: 0
  shutdown: graceful

spring:
  application:
    name: aggregator
  lifecycle:
    timeout-per-shutdown-phase: 30s
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: aggregator-group
      auto-offset-reset: earliest

kafka:
  topics:
    user-actions: stats.user-actions.v1
    events-similarity: stats.events-similarity.v1

management:
  endpoints:
    web:
      exposure:
        include: health,info