server:
  port: 8080

spring:
  cloud:
    gateway:
      handler-mapping-order: 10
      discovery:
        locator:
          enabled: false
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/admin/users,/admin/users/**
        - id: category-service
          uri: lb://category-service
          predicates:
            - Path=/admin/categories,/admin/categories/**,/categories,/categories/**
        - id: event-service
          uri: lb://event-service
          predicates:
            - Path=/admin/events,/admin/events/**,/events,/events/**,/users/{userId}/events,/users/{userId}/events/**,/internal/events/**
        - id: request-service
          uri: lb://request-service
          predicates:
            - Path=/users/{userId}/requests,/users/{userId}/requests/**,/internal/requests/**
        - id: compilation-service
          uri: lb://compilation-service
          predicates:
            - Path=/admin/compilations,/admin/compilations/**,/compilations,/compilations/**
        - id: main-service
          uri: lb://main-service
          predicates:
            - Path=/**

management:
  endpoint:
    gateway:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,gateway