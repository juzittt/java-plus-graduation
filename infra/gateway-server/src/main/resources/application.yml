server:
  port: 8080

spring:
  application:
    name: gateway-server
  main:
    web-application-type: reactive
  config:
    import: "optional:configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
  instance:
    instance-id: "${spring.application.name}:${random.value}"