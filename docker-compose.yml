services:

  users-db:
    image: postgres:16.1
    container_name: ewm-users-db
    ports:
      - "6503:5432"
    environment:
      POSTGRES_DB: ewm_users
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: 12345
    networks:
      - app-network

  categories-db:
    image: postgres:16.1
    container_name: ewm-categories-db
    ports:
      - "6504:5432"
    environment:
      POSTGRES_DB: ewm_categories
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: 12345
    networks:
      - app-network

  events-db:
    image: postgres:16.1
    container_name: ewm-events-db
    ports:
      - "6505:5432"
    environment:
      POSTGRES_DB: ewm_events
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: 12345
    networks:
      - app-network

  requests-db:
    image: postgres:16.1
    container_name: ewm-requests-db
    ports:
      - "6506:5432"
    environment:
      POSTGRES_DB: ewm_requests
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: 12345
    networks:
      - app-network

  compilations-db:
    image: postgres:16.1
    container_name: ewm-compilations-db
    ports:
      - "6507:5432"
    environment:
      POSTGRES_DB: ewm_compilations
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: 12345
    networks:
      - app-network

  ewm-main-db:
    image: postgres:16.1
    container_name: ewm-main-db
    ports:
      - "6502:5432"
    environment:
      POSTGRES_DB: ewm
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: 12345
    networks:
      - app-network

  stats-db:
    image: postgres:16.1
    container_name: ewm-stats-db
    ports:
      - "6501:5432"
    environment:
      POSTGRES_DB: stats
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: 12345
    networks:
      - app-network

networks:
  app-network:
    driver: bridge