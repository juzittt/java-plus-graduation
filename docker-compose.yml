services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - app-network

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - app-network

  schema-registry:
    image: confluentinc/cp-schema-registry:7.3.0
    container_name: schema-registry
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks:
      - app-network

  users-db:
    image: postgres:16.1
    container_name: ewm-users-db
    ports:
      - "6503:5432"
    environment:
      POSTGRES_DB: ewm_users
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: 12345
    networks:
      - app-network

  categories-db:
    image: postgres:16.1
    container_name: ewm-categories-db
    ports:
      - "6504:5432"
    environment:
      POSTGRES_DB: ewm_categories
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: 12345
    networks:
      - app-network

  events-db:
    image: postgres:16.1
    container_name: ewm-events-db
    ports:
      - "6505:5432"
    environment:
      POSTGRES_DB: ewm_events
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: 12345
    networks:
      - app-network

  requests-db:
    image: postgres:16.1
    container_name: ewm-requests-db
    ports:
      - "6506:5432"
    environment:
      POSTGRES_DB: ewm_requests
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: 12345
    networks:
      - app-network

  compilations-db:
    image: postgres:16.1
    container_name: ewm-compilations-db
    ports:
      - "6507:5432"
    environment:
      POSTGRES_DB: ewm_compilations
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: 12345
    networks:
      - app-network

  recommendations-db:
    image: postgres:16.1
    container_name: ewm-recommendations-db
    ports:
      - "6508:5432"
    environment:
      POSTGRES_DB: ewm_recommendations
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: 12345
    networks:
      - app-network

  stats-db:
    image: postgres:16.1
    container_name: ewm-stats-db
    ports:
      - "6501:5432"
    environment:
      POSTGRES_DB: stats
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: 12345
    networks:
      - app-network

networks:
  app-network:
    driver: bridge